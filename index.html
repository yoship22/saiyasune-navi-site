
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>最安値ナビ｜公式サイト</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f7fb;
      color: #172033;
      text-align: center;
      padding: 50px 20px;
    }
    main {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 40px 24px;
      border-radius: 18px;
    }
    h1 { color: #2457d6; }
    p { line-height: 1.8; }

<body>
  <main>
    <h1>最安値ナビ</h1>
    <h2>最安値を、ひと目で。</h2>

      商品名から検索し、価格や送料を比較して、
      お得な購入先を探せるサービスを開発中です。
